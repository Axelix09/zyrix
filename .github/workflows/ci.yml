name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck public declarations
        run: npm run typecheck

      - name: Generate types from source
        run: npm run types:generate

      # Fails when a public signature changes without regenerating types-surface.json, or
      # when the declarations and the runtime exports diverge.
      - name: Public type contract (drift)
        run: npm run types:check

      - name: Tests
        run: npm test

      # Node 22 supports the coverage threshold flags (Node 20 does not), so the gate runs
      # there. Keep the report in the other matrix entries for visibility.
      - name: Coverage report, 90% line gate and README stats check
        if: matrix.node == 22
        run: |
          set -o pipefail
          node --test --experimental-test-coverage --test-coverage-lines=90 2>&1 | tee coverage-output.txt
          node scripts/readme-stats.mjs --check --from coverage-output.txt

      - name: Coverage report
        if: matrix.node != 22
        run: npm run test:coverage

      - name: Verify published package contents
        if: matrix.node == 22
        run: |
          npm pack --dry-run --json > pack.json
          if node -e "const f=require('./pack.json')[0].files.map(x=>x.path);process.exit(f.some(p=>/^(tests|type-tests|scripts)\//.test(p))?1:0)"; then
            echo "Package contents OK"
          else
            echo "Package includes test or script files" >&2
            exit 1
          fi
