name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Instalar dependencias
        run: npm install

      - name: Typecheck de las declaraciones públicas
        run: npm run typecheck

      - name: Generar tipos desde el código fuente (detección de deriva)
        run: |
          npm run types:generate
          if [ -n "$(find types-generated -name '*.d.ts' | head -1)" ]; then
            echo "Declaraciones generadas correctamente"
          else
            echo "types:generate no produjo declaraciones" >&2
            exit 1
          fi

      - name: Tests
        run: npm test
